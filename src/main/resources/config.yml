# Config.yml
# Delay (in seconds) before a /home teleport actually happens.
# The player sees a countdown in their action bar and the teleport is
# cancelled if they move or take damage during the warmup.
# Set to 0 to teleport instantly with no warmup.
teleport-warmup-seconds: 3

# If true, moving (even one block) during the warmup cancels the teleport.
cancel-on-move: true
# If true, taking damage during the warmup cancels the teleport. Kept
# separate from cancel-on-move so you can allow standing still without
# cancelling (e.g. AFK-friendly warmups) while still cancelling on combat.
cancel-on-damage: true

# How long (in seconds) a /sharehome link stays clickable before it expires.
sharehome-expiry-seconds: 300
# Cooldown (in seconds) between two /sharehome uses. Set to 0 to disable.
sharehome-cooldown-seconds: 30

# If true, dying also records a /back point (so you can return to where you died).
back-on-death: true

# /rtp settings: teleports the player to a random safe spot around their world's spawn.
rtp-min-radius: 100
rtp-max-radius: 5000
# How many random spots to try before giving up and telling the player to try again.
rtp-max-attempts: 20
# Cooldown (in seconds) between two /rtp uses. Set to 0 to disable.
rtp-cooldown-seconds: 30

# Size of the /trash inventory in slots. Must be a multiple of 9, between 9 and 54.
trash-size: 27

# Toggle Poppy's custom join/quit chat messages. Set to false if another plugin already handles these.
custom-join-message: true
custom-quit-message: true

# If true, shows each player's health (in hearts) next to their name in the tab list.
show-health-in-tab: true
# How often (in ticks, 20 = 1 second) the tab list health is refreshed.
tab-health-update-interval-ticks: 20

# Combat tag: blocks /home, /spawn, /back and /rtp for a short time after PvP combat
# (hitting or being hit by another player), to stop players teleporting away mid-fight.
combat-tag-enabled: true
combat-tag-seconds: 10

# Auto-AFK: automatically marks a player as AFK after this many minutes without moving.
# /afk still works as a manual toggle regardless of this setting.
afk-auto-enabled: true
afk-auto-minutes: 5

# Toggle Poppy's custom "unknown command" message (replaces vanilla's "Unknown command").
custom-unknown-command-message: true

# If true, scans every player's homes file at startup to log a total home
# count. Turn this off on very large servers if startup feels slower.
startup-stats-enabled: true

# How long (in seconds) a /tpa or /tpahere request stays pending before it expires.
tpa-expiry-seconds: 60

# If true, sends the player their coordinates in chat when they die.
death-coords-enabled: true

# Death chest: stores a dying player's dropped items in a protected chest at
# (or near) their death location instead of scattering them on the ground.
death-chest-enabled: true
# If true, only the owner (or someone with poppy.deathchest.bypass) can open it.
death-chest-protect: true
# How long (in minutes) the chest stays protected before it's removed and any
# remaining items drop naturally on the ground. Set to 0 to never expire.
death-chest-expiry-minutes: 30

# If true, a dying player's lost XP is captured into a bottle placed in
# their death chest (right-clicking it restores the exact XP), instead of
# dropping as orbs on the ground.
death-chest-store-xp: true

# Percentage (0-100) of online players in a world who need to be sleeping for
# the night to skip, matching Minecraft's own playersSleepingPercentage
# gamerule (applied automatically to every world on startup). Example: 50
# means half the online players need to sleep — matches your examples: 1/2,
# 4/6, or 4/7 sleeping all skip the night; 1/5 does not.
sleep-percentage: 50

# If true, broadcasts a "X/Y players sleeping" message to everyone in the
# same world whenever a player gets into bed.
sleep-status-message-enabled: true

# Advanced logging: writes detailed activity logs (who did what, when) to
# daily-rotating files under plugins/Poppy/logs/, separate from the
# startup/shutdown console summary.
logging:
  enabled: true
  console-mirror: false
  # How often (in seconds) queued log lines are flushed to disk in a batch,
  # instead of opening the file for every single event.
  flush-interval-seconds: 3
  # How many days of daily log files to keep — older poppy-YYYY-MM-DD.log
  # files are deleted on startup. Set to 0 to keep every log file forever.
  retention-days: 30
  categories:
    home: true
    teleport: true
    share: true
    tpa: true
    death: true
    death_chest: true
    combat: true
    afk: true
    sleep: true
    easter_egg: true
    admin: true

# Home limit: players without any poppy.homes.<n> permission get this many
# homes. Grant a tier permission (see homes-limit-tiers below) to give a
# group a higher limit — the highest tier they have wins.
homes-default-limit: 10
# Which tiers to check for poppy.homes.<n> permissions. All limits are
# capped at 54 (one double chest, the /homes GUI's physical size).
homes-limit-tiers: [5, 10, 20, 30, 54]

# Percentage (0-100) of a dying player's total XP restored via the death
# chest's XP bottle. 50 by default — a middle ground: 100 would fully
# cancel the death XP penalty, which combined with items also surviving
# death makes dying nearly consequence-free on a survival server; 0 means
# the bottle doesn't buy back any of it. The bottle is bound to whoever
# died, so it can't be traded to another player to transfer XP between
# accounts. Vanilla itself only drops min(7 x level, 100) XP on death.
death-chest-xp-refund-percent: 50

# Cooldown (in seconds) between two /feed uses. Set to 0 to disable.
feed-cooldown-seconds: 180

# Cooldown (in seconds) between two /heal uses. Set to 0 to disable.
heal-cooldown-seconds: 180

# Silk Touch spawners: breaking a mob spawner with a Silk Touch tool drops
# a placeable spawner item (instead of vanilla's "never drops"), keeping
# its mob type. Doesn't apply in Creative mode (vanilla never drops items
# there regardless of enchantments).
silkspawner-enabled: true
# Entity type names (vanilla constants, e.g. SKELETON, ZOMBIE,
# WITHER_SKELETON) that can never be picked up this way, even with Silk
# Touch — breaking one of these behaves as vanilla (no drop). Empty by
# default.
silkspawner-blacklist: []

# After this many invalid /poppygoto tokens in a row, the player is
# temporarily locked out from trying again — a defense-in-depth measure
# against brute-forcing a valid /sharehome token (already computationally
# infeasible on its own, since tokens are full 128-bit UUIDs).
sharehome-max-failed-attempts: 5
# How long (in seconds) that lockout lasts.
sharehome-lockout-seconds: 60

# How long (in seconds) /fly is locked out after a player who was flying
# (or had flight enabled) takes damage. Set to 0 to disable the lockout.
fly-lockout-seconds: 30

# If true, shows a small particle ring under a player's feet while /fly
# (the command, not Creative/Spectator flight) is active and they're
# airborne — makes the two visually distinguishable.
fly-particles-enabled: true

# Maximum distance (in blocks) allowed between requester and target for
# /tpaccept to actually teleport them — set to 0 for no limit. Prevents
# /tpa or /tpahere being used as a free, instant, world-wide teleport
# network between two accounts.
tpa-max-distance: 0
# If false, /tpaccept refuses to teleport across different worlds
# (Overworld/Nether/End), even within tpa-max-distance.
tpa-allow-cross-world: true

# If true, a player who disconnects while combat-tagged is killed
# immediately and a message is broadcast to the whole server — closes the
# classic "Alt+F4 to escape a losing fight" exploit.
combat-log-punish: true

# Cooldown (in seconds) between two /afk toggles. Prevents a macro spamming
# the AFK broadcast to every online player.
afk-toggle-cooldown-seconds: 5
# Cooldown (in seconds) between two /poppy easter egg uses.
poppy-easteregg-cooldown-seconds: 3
# Cooldown (in seconds) between two "X/Y players sleeping" broadcasts
# triggered by the same player repeatedly entering a bed.
sleep-status-cooldown-seconds: 5
# Cooldown (in seconds) between two /tpa or /tpahere requests sent by the
# same player — prevents using teleport requests as a harassment/spam vector.
tpa-request-cooldown-seconds: 5

# If true, /tpaccept refuses to teleport a player into a location owned by
# someone currently combat-tagged — blocks using /tpahere to bring an ally
# straight into an ongoing fight, or /tpa to teleport into one.
tpa-block-to-combat: true

# If true, /fly's login/gamemode-switch safety net forces allowFlight off
# for any Survival/Adventure player not currently tracked as an active
# /fly user — closes the "disconnect while /fly is on to keep flying
# forever" exploit, but also overwrites flight granted by any OTHER
# plugin (a VIP rank, a spawn-area flight perk, a staff mode, an event
# plugin). Set to false if you run another plugin that grants flight
# outside of Poppy's own /fly command.
fly-force-disable-on-join: true

# If true, a player kicked while in combat is also punished by the
# combat-log system (drop + health to 0) — off by default, since a kick
# (admin kick, anti-cheat false positive) usually shouldn't be treated the
# same as a voluntary disconnect.
combat-log-punish-on-kick: false

# Server-wide cap on how many /rtp searches can be in flight at once
# (independent of each player's own cooldown). Each search can trigger up
# to rtp-max-attempts chunk generations, so this bounds worst-case
# concurrent load. Raise on a large server, lower on a small one.
rtp-max-concurrent-searches: 3

# Maximum cumulative time (in minutes) a player can have /fly enabled
# before being forced to land and wait out a cooldown. Cumulative, not
# per-session: toggling /fly off and back on doesn't reset the counter,
# only actually hitting the cap and waiting out the cooldown below does.
# Set to 0 to disable this limit entirely (only the post-damage lockout
# still applies).
fly-max-duration-minutes: 30
# How long (in minutes) a player must wait after hitting the max flight
# duration above before they can use /fly again.
fly-max-duration-cooldown-minutes: 60

# How many seconds before a player's cumulative flight budget runs out to
# warn them with a chat message. Set to 0 to disable the warning.
fly-max-duration-warning-seconds: 30

# Cooldown (in seconds) between two /tpatoggle uses — /tpatoggle writes a
# small file to disk synchronously each time, so this prevents spamming
# that write with no real purpose.
tpa-toggle-cooldown-seconds: 3

# If true, a death chest is take-only: the owner (or a bypass-permission
# player) can withdraw items from it, but nobody can deposit anything —
# closing off using it as a free, unbreakable, explosion-immune storage
# chest for the duration of death-chest-expiry-minutes. Set to false to
# allow deposits like a normal chest.
death-chest-read-only: true

# Simple built-in economy backing /money and /pay.
max-money: 10000000000000
min-money: 0
starting-money: 0

# How many players to show in /baltop.
baltop-size: 10
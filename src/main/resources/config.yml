# Config.yml
# Delay (in seconds) before a /home teleport actually happens.
# The player sees a countdown in their action bar and the teleport is
# cancelled if they move or take damage during the warmup.
# Set to 0 to teleport instantly with no warmup.
teleport-warmup-seconds: 3

# If true, moving (even one block) during the warmup cancels the teleport.
cancel-on-move: true
# If true, taking damage during the warmup cancels the teleport. Kept
# separate from cancel-on-move so you can allow standing still without
# cancelling (e.g. AFK-friendly warmups) while still cancelling on combat.
cancel-on-damage: true

# How long (in seconds) a /sharehome link stays clickable before it expires.
sharehome-expiry-seconds: 300
# Cooldown (in seconds) between two /sharehome uses. Set to 0 to disable.
sharehome-cooldown-seconds: 30

# If true, dying also records a /back point (so you can return to where you died).
back-on-death: true

# /rtp settings: teleports the player to a random safe spot around their world's spawn.
rtp-min-radius: 100
rtp-max-radius: 5000
# How many random spots to try before giving up and telling the player to try again.
rtp-max-attempts: 20
# Cooldown (in seconds) between two /rtp uses. Set to 0 to disable.
rtp-cooldown-seconds: 30

# Size of the /trash inventory in slots. Must be a multiple of 9, between 9 and 54.
trash-size: 27

# Toggle Poppy's custom join/quit chat messages. Set to false if another plugin already handles these.
custom-join-message: true
custom-quit-message: true

# If true, shows each player's health (in hearts) next to their name in the tab list.
show-health-in-tab: true
# How often (in ticks, 20 = 1 second) the tab list health is refreshed.
tab-health-update-interval-ticks: 20

# Combat tag: blocks /home, /spawn, /back and /rtp for a short time after PvP combat
# (hitting or being hit by another player), to stop players teleporting away mid-fight.
combat-tag-enabled: true
combat-tag-seconds: 10

# Auto-AFK: automatically marks a player as AFK after this many minutes without moving.
# /afk still works as a manual toggle regardless of this setting.
afk-auto-enabled: true
afk-auto-minutes: 5

# Toggle Poppy's custom "unknown command" message (replaces vanilla's "Unknown command").
custom-unknown-command-message: true

# If true, scans every player's homes file at startup to log a total home
# count. Turn this off on very large servers if startup feels slower.
startup-stats-enabled: true

# How long (in seconds) a /tpa or /tpahere request stays pending before it expires.
tpa-expiry-seconds: 60

# If true, sends the player their coordinates in chat when they die.
death-coords-enabled: true

# Death chest: stores a dying player's dropped items in a protected chest at
# (or near) their death location instead of scattering them on the ground.
death-chest-enabled: true
# If true, only the owner (or someone with poppy.deathchest.bypass) can open it.
death-chest-protect: true
# How long (in minutes) the chest stays protected before it's removed and any
# remaining items drop naturally on the ground. Set to 0 to never expire.
death-chest-expiry-minutes: 30

# If true, a dying player's lost XP is captured into a bottle placed in
# their death chest (right-clicking it restores the exact XP), instead of
# dropping as orbs on the ground.
death-chest-store-xp: true

# Percentage (0-100) of online players in a world who need to be sleeping for
# the night to skip, matching Minecraft's own playersSleepingPercentage
# gamerule (applied automatically to every world on startup). Example: 50
# means half the online players need to sleep — matches your examples: 1/2,
# 4/6, or 4/7 sleeping all skip the night; 1/5 does not.
sleep-percentage: 50

# If true, broadcasts a "X/Y players sleeping" message to everyone in the
# same world whenever a player gets into bed.
sleep-status-message-enabled: true

# Advanced logging: writes detailed activity logs (who did what, when) to
# daily-rotating files under plugins/Poppy/logs/, separate from the
# startup/shutdown console summary.
logging:
  enabled: true
  console-mirror: false
  # How often (in seconds) queued log lines are flushed to disk in a batch,
  # instead of opening the file for every single event.
  flush-interval-seconds: 3
  categories:
    home: true
    teleport: true
    share: true
    tpa: true
    death: true
    death_chest: true
    combat: true
    afk: true
    sleep: true
    easter_egg: true
    admin: true

# Home limit: players without any poppy.homes.<n> permission get this many
# homes. Grant a tier permission (see homes-limit-tiers below) to give a
# group a higher limit — the highest tier they have wins.
homes-default-limit: 10
# Which tiers to check for poppy.homes.<n> permissions. All limits are
# capped at 54 (one double chest, the /homes GUI's physical size).
homes-limit-tiers: [5, 10, 20, 30, 54]

# Percentage (0-100) of a dying player's total XP restored via the death
# chest's XP bottle. 100 fully cancels the death XP penalty (the default,
# and previously the only behavior — this key just makes it configurable).
# Vanilla itself only drops min(7 x level, 100) XP on death, so a lower
# value here gets you closer to that if you want death to still sting.
death-chest-xp-refund-percent: 100

# Cooldown (in seconds) between two /feed uses. Set to 0 to disable.
feed-cooldown-seconds: 180

# Cooldown (in seconds) between two /heal uses. Set to 0 to disable.
heal-cooldown-seconds: 180

# Silk Touch spawners: breaking a mob spawner with a Silk Touch tool drops
# a placeable spawner item (instead of vanilla's "never drops"), keeping
# its mob type. Doesn't apply in Creative mode (vanilla never drops items
# there regardless of enchantments).
silkspawner-enabled: true
# Entity type names (vanilla constants, e.g. SKELETON, ZOMBIE,
# WITHER_SKELETON) that can never be picked up this way, even with Silk
# Touch — breaking one of these behaves as vanilla (no drop). Empty by
# default.
silkspawner-blacklist: []
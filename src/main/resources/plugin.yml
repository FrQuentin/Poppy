name: Poppy
version: '${version}'
main: fr.quentin.poppy.Poppy
api-version: '26.2'
load: POSTWORLD

commands:
  sethome:
    description: Create a new home at your current location.
    usage: /sethome <home>
    permission: poppy.sethome
    permission-message: "&4[!] You don't have permission to do this."
  home:
    description: Teleport to one of your homes, or open the homes menu.
    usage: /home [home]
    permission: poppy.home
    permission-message: "&4[!] You don't have permission to do this."
  delhome:
    description: Delete one of your homes.
    usage: /delhome <home>
    permission: poppy.delhome
    permission-message: "&4[!] You don't have permission to do this."
  homes:
    description: Open the GUI listing all your homes.
    usage: /homes
    permission: poppy.homes
    permission-message: "&4[!] You don't have permission to do this."
  setspawn:
    description: Set the server spawn point at your current location.
    usage: /setspawn
    permission: poppy.setspawn
    permission-message: "&4[!] You don't have permission to do this."
  delspawn:
    description: Remove the server spawn point.
    usage: /delspawn
    permission: poppy.delspawn
    permission-message: "&4[!] You don't have permission to do this."
  spawn:
    description: Teleport back to the server spawn point.
    usage: /spawn
    permission: poppy.spawn
    permission-message: "&4[!] You don't have permission to do this."
  sharehome:
    description: Share one of your homes in chat with a clickable teleport link.
    usage: /sharehome <home>
    permission: poppy.sharehome
    permission-message: "&4[!] You don't have permission to do this."
  poppygoto:
    description: Internal command used by /sharehome links. Don't run this manually.
    usage: /poppygoto <token>
  deathback:
    description: Internal command triggered by the death coordinates message. Don't run this manually.
    usage: /deathback
    permission: poppy.deathback
    permission-message: "&4[!] You don't have permission to do this."
  back:
    description: Teleport back to your location before your last teleport, or where you died.
    usage: /back
    permission: poppy.back
    permission-message: "&4[!] You don't have permission to do this."
  rtp:
    description: Teleport to a random safe location in the wilderness.
    usage: /rtp
    permission: poppy.rtp
    permission-message: "&4[!] You don't have permission to do this."
  trash:
    description: Open a trash can - anything left inside when you close it is deleted.
    usage: /trash
    permission: poppy.trash
    permission-message: "&4[!] You don't have permission to do this."
  afk:
    description: Toggle your AFK status, broadcast to the whole server.
    usage: /afk
    permission: poppy.afk
    permission-message: "&4[!] You don't have permission to do this."
  tpa:
    description: Request to teleport to another player.
    usage: /tpa <player>
    permission: poppy.tpa
    permission-message: "&4[!] You don't have permission to do this."
  tpaccept:
    description: Accept a pending teleport request.
    usage: /tpaccept <player>
    permission: poppy.tpa
    permission-message: "&4[!] You don't have permission to do this."
  tpadeny:
    description: Deny a pending teleport request.
    usage: /tpadeny <player>
    permission: poppy.tpa
    permission-message: "&4[!] You don't have permission to do this."
  tpahere:
    description: Request another player to teleport to you.
    usage: /tpahere <player>
    permission: poppy.tpahere
    permission-message: "&4[!] You don't have permission to do this."
  tpacancel:
    description: Cancel your own pending teleport request.
    usage: /tpacancel <player>
    permission: poppy.tpa
    permission-message: "&4[!] You don't have permission to do this."
  poppy:
    description: A little easter egg (or /poppy reload to reload config.yml/messages.yml).
    usage: /poppy [reload]
    permission: poppy.poppy
    permission-message: "&4[!] You don't have permission to do this."
  feed:
    description: Fully restore your hunger and saturation.
    usage: /feed
    permission: poppy.feed
    permission-message: "&4[!] You don't have permission to do this."
  heal:
    description: Fully restore your health.
    usage: /heal
    permission: poppy.heal
    permission-message: "&4[!] You don't have permission to do this."
  fly:
    description: Toggle flight, temporarily disabled after taking damage.
    usage: /fly
    permission: poppy.fly
    permission-message: "&4[!] You don't have permission to do this."
  combat:
    description: Check how much combat-tag time you have left.
    usage: /combat
    permission: poppy.combat
    permission-message: "&4[!] You don't have permission to do this."
  tpatoggle:
    description: Toggle whether you accept incoming teleport requests.
    usage: /tpatoggle
    permission: poppy.tpa
    permission-message: "&4[!] You don't have permission to do this."
  cooldowns:
    description: See your remaining cooldowns.
    usage: /cooldowns
    permission: poppy.cooldowns
    permission-message: "&4[!] You don't have permission to do this."
  flytime:
    description: Check your remaining cumulative flight time.
    usage: /flytime
    permission: poppy.fly
    permission-message: "&4[!] You don't have permission to do this."
  playtime:
    description: Check your total playtime and join date.
    usage: /playtime
    permission: poppy.playtime
    permission-message: "&4[!] You don't have permission to do this."
  msg:
    description: Send a private message to another player.
    usage: /msg <player> <message>
    aliases: [ tell, w, whisper ]
    permission: poppy.msg
    permission-message: "&4[!] You don't have permission to do this."
  reply:
    description: Reply to your last private message conversation.
    usage: /reply <message>
    aliases: [ r ]
    permission: poppy.msg
    permission-message: "&4[!] You don't have permission to do this."
  bugs:
    description: Show a link to report bugs on GitHub.
    usage: /bugs
    permission: poppy.bugs
    permission-message: "&4[!] You don't have permission to do this."
  veinminer:
    description: Toggle veinminer — mine a whole connected ore vein at once.
    usage: /veinminer
    permission: poppy.veinminer
    permission-message: "&4[!] You don't have permission to do this."
  treecapitator:
    description: Toggle treecapitator — chop a whole connected tree at once.
    usage: /treecapitator
    permission: poppy.treecapitator
    permission-message: "&4[!] You don't have permission to do this."

permissions:
  poppy.*:
    description: Grants access to every Poppy command, including admin ones.
    default: op
    children:
      poppy.sethome: true
      poppy.home: true
      poppy.delhome: true
      poppy.homes: true
      poppy.setspawn: true
      poppy.delspawn: true
      poppy.spawn: true
      poppy.sharehome: true
      poppy.back: true
      poppy.rtp: true
      poppy.trash: true
      poppy.afk: true
      poppy.tpa: true
      poppy.tpahere: true
      poppy.poppy: true
      poppy.deathchest.bypass: true
      poppy.reload: true
      poppy.homes.54: true
      poppy.feed: true
      poppy.heal: true
      poppy.silkspawner: true
      poppy.fly: true
      poppy.combat: true
      poppy.cooldowns: true
      poppy.deathback: true
      poppy.playtime: true
      poppy.playtime.admin: true
      poppy.msg: true
      poppy.chat.bypass: true
      poppy.bugs: true
      poppy.veinminer: true
      poppy.treecapitator: true

  poppy.sethome:
    description: Allows creating homes with /sethome.
    default: true
  poppy.home:
    description: Allows teleporting to a home with /home.
    default: true
  poppy.delhome:
    description: Allows deleting homes with /delhome (and via the /homes GUI).
    default: true
  poppy.homes:
    description: Allows opening the /homes GUI.
    default: true
  poppy.setspawn:
    description: Allows setting the server spawn point.
    default: op
  poppy.delspawn:
    description: Allows removing the server spawn point.
    default: op
  poppy.spawn:
    description: Allows teleporting to the server spawn point with /spawn.
    default: true
  poppy.sharehome:
    description: Allows sharing homes in chat with /sharehome.
    default: true
  poppy.back:
    description: Allows returning to the previous location with /back.
    default: true
  poppy.rtp:
    description: Allows random-teleporting into the wilderness with /rtp.
    default: true
  poppy.trash:
    description: Allows opening a trash can with /trash.
    default: true
  poppy.afk:
    description: Allows toggling AFK status with /afk.
    default: true
  poppy.tpa:
    description: Allows sending, accepting, and denying teleport requests with /tpa, /tpaccept, /tpadeny.
    default: true
  poppy.tpahere:
    description: Allows requesting another player teleport to you with /tpahere.
    default: true
  poppy.poppy:
    description: Allows using the /poppy easter egg command.
    default: true
  poppy.deathchest.bypass:
    description: Allows opening any player's death chest, bypassing ownership protection.
    default: op
  poppy.reload:
    description: Allows reloading config.yml and messages.yml with /poppy reload.
    default: op
  poppy.homes.5:
    description: Grants a home limit of 5 (only applies if higher than the default limit).
    default: false
  poppy.homes.10:
    description: Grants a home limit of 10 (only applies if higher than the default limit).
    default: false
  poppy.homes.20:
    description: Grants a home limit of 20 (only applies if higher than the default limit).
    default: false
  poppy.homes.30:
    description: Grants a home limit of 30 (only applies if higher than the default limit).
    default: false
  poppy.homes.54:
    description: Grants the maximum home limit of 54 (one double chest).
    default: false
  poppy.feed:
    description: Allows restoring hunger and saturation with /feed.
    default: true
  poppy.heal:
    description: Allows restoring health with /heal.
    default: true
  poppy.silkspawner:
    description: Allows picking up mob spawners with Silk Touch.
    default: true
  poppy.fly:
    description: Allows toggling flight with /fly.
    default: op
  poppy.combat:
    description: Allows checking remaining combat-tag time with /combat.
    default: true
  poppy.cooldowns:
    description: Allows checking cooldowns with /cooldowns.
    default: true
  poppy.deathback:
    description: Allows returning to your last death location via the death coordinates link.
    default: true
  poppy.playtime:
    description: Allows checking your own playtime and join date with /playtime.
    default: true
  poppy.playtime.admin:
    description: Allows checking another player's playtime with /playtime <player>.
    default: op
  poppy.msg:
    description: Allows sending and receiving private messages with /msg and /reply.
    default: true
  poppy.chat.bypass:
    description: Allows bypassing the chat cooldown between messages.
    default: op
  poppy.bugs:
    description: Allows viewing the bug report link with /bugs.
    default: true
  poppy.veinminer:
    description: Allows toggling veinminer with /veinminer.
    default: true
  poppy.treecapitator:
    description: Allows toggling treecapitator with /treecapitator.
    default: true
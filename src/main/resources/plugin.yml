name: Poppy
version: '${version}'

main: fr.quentin.poppy.Poppy
api-version: '26.2'
load: POSTWORLD

commands:
  sethome:
    description: Create a new home at your current location.
    usage: /sethome <home>
  home:
    description: Teleport to one of your homes, or open the homes menu.
    usage: /home [home]
  delhome:
    description: Delete one of your homes.
    usage: /delhome <home>
  homes:
    description: Open the GUI listing all your homes.
    usage: /homes
  setspawn:
    description: Set the server spawn point at your current location.
    usage: /setspawn
    permission: poppy.setspawn
    permission-message: "&4[!] You don't have permission to do this."
  spawn:
    description: Teleport back to the server spawn point.
    usage: /spawn
  sharehome:
    description: Share one of your homes in chat with a clickable teleport link.
    usage: /sharehome <home>
  poppygoto:
    description: Internal command used by /sharehome links. Don't run this manually.
    usage: /poppygoto <token>
  back:
    description: Teleport back to your location before your last teleport, or where you died.
    usage: /back
  rtp:
    description: Teleport to a random safe location in the wilderness.
    usage: /rtp

permissions:
  poppy.use:
    description: Allows use of all Poppy home commands.
    default: true
  poppy.setspawn:
    description: Allows setting the server spawn point.
    default: op